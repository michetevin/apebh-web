<!-- header.html -->
<style>
  /* ==========================================================================
     HEADER CIRCULAIRE STICKY — STYLES AUTONOMES
     ========================================================================== */

  /* Variables de secours si non définies globalement */
  :root {
    --c-green:        #32a630;
    --c-green-dark:   #268a24;
    --c-green-soft:   #EAF0E8;
    --c-green-text:   #2E7D32;
    --c-ink:          #2F3C4C;
    --c-line:         #E1E6E3;
    --c-orange:       #E07A3F;
    --r-pill:         999px;
  }

  .site-header {
    position: sticky;
    top: 1cm;
    z-index: 1000;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: none;
    margin-top: 1cm;
    height: 70px;
  }

  .header-inner {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    height: 100%;
    padding: 0 1rem;
  }

  /* Logo séparé, à gauche */
  .logo {
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: auto;
    z-index: 2;
  }
  .logo img {
    height: 40px;
    width: auto;
    display: block;
  }

  /* Pilule de navigation centrée */
  .nav-pill {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    pointer-events: auto;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(8px);
    border-radius: var(--r-pill);
    padding: 0.5rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 1.5rem;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.5);
    white-space: nowrap;
    max-width: 90vw;
    overflow-x: auto;
    overflow-y: visible;
    scrollbar-width: none;
  }
  .nav-pill::-webkit-scrollbar {
    display: none;
  }

  .nav-list {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .nav-list > li > a {
    text-decoration: none;
    color: var(--c-ink);
    font-weight: 600;
    font-size: 0.9rem;
    transition: color 0.2s;
    white-space: nowrap;
  }
  .nav-list > li > a:hover {
    color: var(--c-green);
  }

  /* Dropdown */
  .dropdown {
    position: relative;
  }
  .dropdown-toggle {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    cursor: pointer;
  }
  .caret {
    font-size: 0.7rem;
    transition: transform 0.2s;
  }
  .dropdown:hover .caret {
    transform: rotate(180deg);
  }
  .dropdown-menu {
    position: absolute;
    top: 100%;
    left: 0;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    padding: 0.5rem 0;
    min-width: 180px;
    display: none;
    flex-direction: column;
    z-index: 1001;
    list-style: none;
    margin: 0.5rem 0 0;
    border: 1px solid var(--c-line);
    overflow: hidden;
  }
  .dropdown:hover .dropdown-menu {
    display: flex;
  }
  .dropdown-menu li a {
    display: block;
    padding: 0.5rem 1rem;
    text-decoration: none;
    color: var(--c-ink);
    font-size: 0.85rem;
    font-weight: 500;
    transition: background 0.15s, color 0.15s;
    white-space: nowrap;
  }
  .dropdown-menu li a:hover {
    background: var(--c-green-soft);
    color: var(--c-green);
  }

  /* Bouton Blog */
  .btn-blog {
    background: var(--c-green);
    color: #fff !important;
    padding: 0.4rem 1rem;
    border-radius: 999px;
    font-weight: 700;
    text-decoration: none;
    font-size: 0.85rem;
    transition: background 0.2s;
    white-space: nowrap;
  }
  .btn-blog:hover {
    background: var(--c-green-dark);
    color: #fff !important;
  }

  /* Responsive */
  @media (max-width: 900px) {
    .logo {
      display: none;
    }
    .nav-pill {
      position: relative;
      left: auto;
      transform: translateY(-50%);
      top: 50%;
      margin: 0 auto;
    }
  }

  @media (max-width: 720px) {
    .nav-pill {
      padding: 0.4rem 1rem;
      gap: 0.8rem;
    }
    .nav-list {
      gap: 0.8rem;
    }
    .nav-list > li > a {
      font-size: 0.8rem;
    }
    .btn-blog {
      padding: 0.3rem 0.8rem;
      font-size: 0.8rem;
    }
  }
</style>

<header class="site-header">
  <div class="header-inner">
    <!-- Logo à gauche, séparé de la pilule -->
    <a href="/" class="logo" aria-label="Accueil APEBH">
      <img src="/images/logo.png" alt="Logo APEBH">
    </a>

    <!-- Pilule de navigation centrée -->
    <nav class="nav-pill" aria-label="Navigation principale">
      <ul class="nav-list">
        <li><a href="/notre-histoire/">Notre histoire</a></li>

        <li class="dropdown">
          <a href="#" class="dropdown-toggle">Nos actions <span class="caret">▼</span></a>
          <ul class="dropdown-menu">
            <li><a href="/nos-actions/securite-alimentaire/">Sécurité alimentaire</a></li>
            <li><a href="/nos-actions/environnement/">Environnement</a></li>
            <li><a href="/nos-actions/plaidoyer/">Plaidoyer</a></li>
            <li><a href="/nos-actions/qualite-air/">Qualité de l'air</a></li>
          </ul>
        </li>

        <li><a href="/communaute/">Communauté</a></li>
        <li><a href="/ressources/">Ressources</a></li>
        <li><a href="/blog/" class="btn-blog">Blog</a></li>
      </ul>
    </nav>
  </div>
</header>
