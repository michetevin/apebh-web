<!-- header.html -->
<style>
  :root {
    --c-green:      #32a630;
    --c-green-dark: #268a24;
    --c-green-soft: #EAF0E8;
    --c-green-text: #2E7D32;
    --c-ink:        #2F3C4C;
    --c-line:       #E1E6E3;
    --c-orange:     #E07A3F;
    --r-pill:       999px;
    --logo-h:       52px;   /* était 80px */
    --header-h:     60px;   /* était 100px */
    --header-gap:   8px;    /* était 1cm */
  }

  /* Fixe = sort du flux, ne pousse plus rien vers le bas */
  .site-header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    height: calc(var(--header-h) + var(--header-gap));
    padding-top: var(--header-gap);
    box-sizing: border-box;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: none;
  }

  /* Réserve la hauteur du header.
     ⚠️ Supprimez ce bloc si votre 1ʳᵉ section a déjà un padding-top. */
  .header-spacer {
    height: calc(var(--header-h) + var(--header-gap));
    pointer-events: none;
  }

  .header-inner {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    height: 100%;
    padding: 0 1rem;
  }

  .logo {
    position: absolute;
    left: 0; top: 50%;
    transform: translateY(-50%);
    pointer-events: auto;
    z-index: 2;
    display: flex;
    align-items: center;
  }
  .logo img { height: var(--logo-h); width: auto; display: block; }

  .nav-pill {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    pointer-events: auto;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: var(--r-pill);
    padding: 0.35rem 1.2rem;   /* un peu plus compact */
    display: flex;
    align-items: center;
    gap: 1.2rem;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    border: 1px solid rgba(255,255,255,0.5);
    white-space: nowrap;
    max-width: 100%;
    overflow: visible;         /* surtout PAS hidden/auto */
  }

  .nav-list {
    display: flex; align-items: center;
    gap: 1.2rem; list-style: none;
    margin: 0; padding: 0;
  }
  .nav-list > li > a {
    text-decoration: none;
    color: var(--c-ink);
    font-weight: 600;
    font-size: 0.88rem;
    transition: color 0.2s;
    white-space: nowrap;
  }
  .nav-list > li > a:hover { color: var(--c-green); }

  /* ---- Dropdown ---- */
  .dropdown { position: relative; }
  .dropdown::after {              /* pont invisible → évite la fermeture au survol */
    content: "";
    position: absolute;
    top: 100%; left: 0; right: 0;
    height: 0.9rem;
    pointer-events: auto;
  }
  .dropdown-toggle {
    display: inline-flex; align-items: center; gap: 0.3rem;
    cursor: pointer;
  }
  .caret { font-size: 0.7rem; transition: transform 0.2s; }
  .dropdown:hover .caret,
  .dropdown:focus-within .caret,
  .dropdown.is-open .caret { transform: rotate(180deg); }

  .dropdown-menu {
    position: absolute;
    top: calc(100% + 0.6rem);
    left: 50%;
    transform: translate(-50%, -6px);
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    padding: 0.5rem 0;
    min-width: 220px;
    display: flex;
    flex-direction: column;
    z-index: 1001;
    list-style: none;
    margin: 0;
    border: 1px solid var(--c-line);
    opacity: 0;
    visibility: hidden;
    transition: opacity .18s ease, transform .18s ease, visibility .18s;
  }
  .dropdown:hover .dropdown-menu,
  .dropdown:focus-within .dropdown-menu,
  .dropdown.is-open .dropdown-menu {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, 0);
  }

  .dropdown-menu li a {
    display: block;
    padding: 0.5rem 1rem;
    text-decoration: none;
    color: var(--c-ink);
    font-size: 0.85rem;
    font-weight: 500;
    transition: background .15s, color .15s;
    white-space: nowrap;
  }
  .dropdown-menu li a:hover,
  .dropdown-menu li a:focus {
    background: var(--c-green-soft);
    color: var(--c-green);
  }
  .dropdown-menu li.dropdown-all {
    margin-top: 0.35rem; padding-top: 0.35rem;
    border-top: 1px solid var(--c-line);
  }
  .dropdown-menu li.dropdown-all a {
    color: var(--c-green-text);
    font-weight: 700;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .dropdown-menu li.dropdown-all a:hover {
    background: var(--c-green-soft);
    color: var(--c-green-dark);
  }

  .btn-blog {
    background: var(--c-green);
    color: #fff !important;
    padding: 0.35rem 0.9rem;
    border-radius: 999px;
    font-weight: 700;
    text-decoration: none;
    font-size: 0.85rem;
    transition: background 0.2s;
    white-space: nowrap;
  }
  .btn-blog:hover { background: var(--c-green-dark); color: #fff !important; }

  @media (max-width: 900px) {
    :root { --header-h: 56px; --logo-h: 44px; }
    .logo { display: none; }
    .nav-pill { position: static; transform: none; margin: 0 auto; max-width: 100%; }
  }

  @media (max-width: 720px) {
    :root { --header-h: 96px; --header-gap: 6px; }  /* nav wraps → plus haut */
    .header-inner { padding: 0 0.5rem; }
    .nav-pill {
      padding: 0.4rem 0.9rem;
      gap: 0.6rem;
      border-radius: 24px;
      white-space: normal;
    }
    .nav-list {
      gap: 0.35rem 0.8rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .nav-list > li > a { font-size: 0.8rem; }
    .btn-blog { padding: 0.3rem 0.8rem; font-size: 0.8rem; }
    .dropdown-menu { left: 0; transform: translateY(-6px); }
    .dropdown:hover .dropdown-menu,
    .dropdown:focus-within .dropdown-menu,
    .dropdown.is-open .dropdown-menu { transform: translateY(0); }
  }
</style>

<header class="site-header">
  <div class="header-inner">
    <a href="/" class="logo" aria-label="Accueil APEBH">
      <img src="/images/logo.png" alt="Logo APEBH">
    </a>

    <nav class="nav-pill" aria-label="Navigation principale">
      <ul class="nav-list">
        <li><a href="/notre-histoire/">Notre histoire</a></li>

        <li class="dropdown">
          <a href="/activites/" class="dropdown-toggle"
             aria-haspopup="true" aria-expanded="false">
            Nos actions <span class="caret">▼</span>
          </a>
          <ul class="dropdown-menu">
            <li><a href="/activites/environnement/">Environnement</a></li>
            <li><a href="/activites/environnement/">Qualité et Air</a></li>
            <li><a href="/activites/plaidoyer/">Plaidoyer</a></li>
            <li><a href="/activites/securite-alimentaire/">Sécurité Alimentaire</a></li>
            <li><a href="/activites/qualite-air/">Qualité de l'air</a></li>
            <li class="dropdown-all"><a href="/activites/">Tous nos activités</a></li>
          </ul>
        </li>

        <li><a href="/communaute/">Communauté</a></li>
        <li><a href="/ressources/">Ressources</a></li>
        <li><a href="/blog/" class="btn-blog">Blog</a></li>
      </ul>
    </nav>
  </div>
</header>

<!-- Compense la hauteur du header fixe.
     Supprimez cette ligne si votre 1ʳᵉ section a déjà son propre padding-top. -->
<div class="header-spacer" aria-hidden="true"></div>

<script>
(function () {
  var dropdowns = Array.prototype.slice.call(
    document.querySelectorAll('.site-header .dropdown')
  );

  function closeAll(except) {
    dropdowns.forEach(function (dd) {
      if (dd === except) return;
      dd.classList.remove('is-open');
      var t = dd.querySelector('.dropdown-toggle');
      if (t) t.setAttribute('aria-expanded', 'false');
    });
  }

  dropdowns.forEach(function (dd) {
    var toggle = dd.querySelector('.dropdown-toggle');
    if (!toggle) return;
    toggle.setAttribute('aria-expanded', 'false');

    toggle.addEventListener('click', function (e) {
      // Survol dispo → on laisse le lien naviguer ; le CSS gère l'ouverture.
      var hoverable = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
      if (hoverable && !dd.classList.contains('is-open')) return;

      e.preventDefault();
      closeAll(dd);
      var open = dd.classList.toggle('is-open');
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  });

  document.addEventListener('click', function (e) {
    if (!e.target.closest('.site-header .dropdown')) closeAll(null);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeAll(null);
  });
})();
</script>
